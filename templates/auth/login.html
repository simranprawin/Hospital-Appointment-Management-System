{% extends "base.html" %}

{% block title %}Login | MediCare+{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">

            <span class="badge">Welcome Back</span>

            <h1>Login to MediCare+</h1>

            <p>
                Access your account and manage your healthcare appointments.
            </p>

        </div>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit" class="btn primary auth-btn">
                Login
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</section>

{% endblock %}
